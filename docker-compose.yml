version: "3"

services:
  slims:
    container_name: slims
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - docker.env
    environment:
      - ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=elib_slims_akti
      - DB_PASS=Akti@123!!
      - DB_NAME=elib_slims_akti
    volumes:
      - appfiles:/var/www/html/files
      - appimages:/var/www/html/images
      - apprepo:/var/www/html/repository
    ports:
      - "${HTTP_PORT}:80"
    networks:
      - proxy
    depends_on:
      - db

  db:
    image: mariadb:lts
    container_name: db
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - ./install/senayan_ddl.sql:/docker-entrypoint-initdb.d/init.sql
      - dbdata:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=Akti@123!!
      - MARIADB_DATABASE=elib_slims_akti
      - MARIADB_USER=elib_slims_akti
      - MARIADB_PASSWORD=Akti@123!!
    networks:
      - proxy

networks:
  proxy:
    driver: bridge

volumes:
  dbdata:
  appfiles:
  appimages:
  apprepo:
